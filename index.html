<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC통신 실시간 대화방</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MonadABXY/suhgung-font@main/suhgung.css">
    <style>
        @import url("https://cdn.jsdelivr.net/gh/MonadABXY/suhgung-font@main/suhgung.css");

        /* 물마루 폰트 (기본) */
        @font-face {
            font-family: 'Mulmaru';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-4@1.1/Mulmaru.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }

        body {
            background-color: #0000AA; /* 하이텔 파란 바탕 */
            color: #FFFFFF;
            font-family: 'Mulmaru', monospace;
            font-size: 18px;
            margin: 0;
            padding: 10px;
            line-height: 1.4;
            height: 100vh;
            height: 100dvh; /* 모바일 가상 키보드 높이 동적 대응 */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            letter-spacing: 1px;
        }

        /* 공통 유틸리티 클래스 */
        .cyan { color: #55FFFF; }
        .green { color: #55FF55; }
        .yellow { color: #FFFF55; }
        .red { color: #FF5555; }
        .white-bg { background-color: #FFFFFF; color: #0000AA; font-weight: bold; padding: 0 4px; }
        
        #screen-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 헤더 바 */
        .header-bar {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #FFFFFF;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        /* 입력 영역 */
        #input-area {
            display: flex;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #FFFFFF;
        }

        #prompt-text { margin-right: 10px; white-space: nowrap; color: #55FFFF; }

        #command-input {
            background-color: transparent;
            border: none;
            color: #FFFFFF;
            font-family: 'Mulmaru', monospace;
            font-size: 18px;
            flex-grow: 1;
            outline: none;
        }

        /* 터미널 출력 창 */
        .terminal-output {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            padding-right: 10px;
        }
        .terminal-output::-webkit-scrollbar { display: none; }

        /* 로딩 스크린 */
        #loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            font-size: 24px;
        }

        @media (max-width: 768px) {
            body { font-size: 15px; padding: 6px; }
            #command-input { font-size: 15px; min-width: 100px; flex-grow: 1; }
            #input-area { flex-wrap: wrap; }
            #prompt-text { white-space: pre-wrap; margin-bottom: 2px; word-break: keep-all; }
            .header-bar { flex-direction: column; gap: 4px; }
            .terminal-output { padding-right: 2px; }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div>
            ATDT 01410<br><br>
            <span style="color:#55FFFF">실시간 대화방에 접속 중입니다...</span>
        </div>
    </div>

    <div id="screen-container">
        <div class="header-bar">
            <div><span class="white-bg">CHAT</span> 실시간 공개 대화방</div>
            <div class="yellow">명령어: /n [닉네임] | /font [물마루/서궁] | /cls | /q</div>
        </div>
        
        <div id="chat-terminal" class="terminal-output"></div>

        <div id="input-area">
            <span id="prompt-text">메시지 입력 >></span>
            <input type="text" id="command-input" autocomplete="off">
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 설정 (기존 정보 동일)
        const firebaseConfig = {
            apiKey: "AIzaSyDDhmcLA1UEE-pMdpEoBIz-EPeUdvv8774",
            authDomain: "pc-communication-chat.firebaseapp.com",
            projectId: "pc-communication-chat",
            storageBucket: "pc-communication-chat.firebasestorage.app",
            messagingSenderId: "932613477787",
            appId: "1:932613477787:web:3bf6974c59e608bdc07d3e",
            measurementId: "G-JRV8DCK7FR"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 모두가 동일한 방을 쓰도록 고정 ID 사용
        const appId = 'pc-comm-global-v1'; 
        const chatCollection = collection(db, 'global_chat', appId, 'messages');

        let nickname = "User_" + Math.floor(Math.random() * 9000 + 1000);
        
        const ui = {
            loading: document.getElementById('loading-screen'),
            promptText: document.getElementById('prompt-text'),
            commandInput: document.getElementById('command-input'),
            chatTerminal: document.getElementById('chat-terminal'),
        };

        let chatUnsubscribe = null;
        const renderedChatIds = new Set();
        let isDisconnected = false;

        async function init() {
            try {
                await signInAnonymously(auth);
                setTimeout(() => {
                    ui.loading.style.display = 'none';
                    ui.commandInput.focus();
                    startRealtimeChat();
                }, 1500); 
            } catch (error) {
                console.error("Auth Error:", error);
                ui.loading.innerHTML = "<span style='color:red'>서버 접속 실패. <br>Firebase 콘솔에서 익명 로그인을 확인해주세요.</span>";
            }
        }

        function startRealtimeChat() {
            ui.chatTerminal.innerHTML = `<div class="green">==================================================</div>
<div class="yellow">통신망 실시간 대화방에 오신 것을 환영합니다!</div>
<div class="cyan">당신의 임시 닉네임은 [${nickname}] 입니다.</div>
<div class="green">==================================================<br><br></div>`;
            
            renderedChatIds.clear();

            chatUnsubscribe = onSnapshot(chatCollection, (snapshot) => {
                const messages = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                messages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                messages.forEach(msg => {
                    if (!renderedChatIds.has(msg.id)) {
                        renderedChatIds.add(msg.id);
                        printChatLine(msg);
                    }
                });
            });
        }

        function printChatLine(msg) {
            const line = document.createElement('div');
            if (msg.type === 'system') {
                line.innerHTML = `<span class="yellow">${escapeHtml(msg.text)}</span>`;
            } else {
                line.innerHTML = `[${escapeHtml(msg.nickname)}] ${escapeHtml(msg.text)}`;
            }
            ui.chatTerminal.appendChild(line);
            ui.chatTerminal.scrollTop = ui.chatTerminal.scrollHeight;
        }

        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        ui.commandInput.addEventListener('keydown', async function(e) {
            if (e.key !== 'Enter' || isDisconnected) return;
            
            const cmd = this.value.trim();
            this.value = '';

            if (cmd === '') return;

            if (cmd.startsWith('/')) {
                const parts = cmd.split(' ');
                const mainCmd = parts[0].toLowerCase();
                const arg = parts.slice(1).join(' ');

                if (mainCmd === '/q' || mainCmd === '/quit') {
                    if (chatUnsubscribe) chatUnsubscribe();
                    isDisconnected = true;
                    ui.commandInput.disabled = true;
                    printChatLine({ type: 'system', text: "NO CARRIER\n통신 연결이 종료되었습니다. (새로고침하여 다시 접속하세요)" });
                } else if (mainCmd === '/n' || mainCmd === '/nick') {
                    if (arg) {
                        nickname = arg;
                        printChatLine({ type: 'system', text: `닉네임이 [${nickname}](으)로 변경되었습니다.` });
                    } else {
                        printChatLine({ type: 'system', text: "사용법: /n [변경할 닉네임]" });
                    }
                } else if (mainCmd === '/font') {
                    if (arg === '서궁') {
                        document.body.style.fontFamily = "'suhgung', monospace";
                        ui.commandInput.style.fontFamily = "'suhgung', monospace";
                        printChatLine({ type: 'system', text: "폰트가 '서궁'으로 변경되었습니다." });
                    } else if (arg === '물마루') {
                        document.body.style.fontFamily = "'Mulmaru', monospace";
                        ui.commandInput.style.fontFamily = "'Mulmaru', monospace";
                        printChatLine({ type: 'system', text: "폰트가 '물마루'로 변경되었습니다." });
                    } else {
                        printChatLine({ type: 'system', text: "사용법: /font [물마루/서궁]" });
                    }
                } else if (mainCmd === '/cls' || mainCmd === '/clear') {
                    ui.chatTerminal.innerHTML = '';
                    printChatLine({ type: 'system', text: "화면이 지워졌습니다." });
                } else {
                    printChatLine({ type: 'system', text: "알 수 없는 명령어입니다. (/n, /font, /cls, /q)" });
                }
            } else {
                if(auth.currentUser) {
                    try {
                        await addDoc(chatCollection, {
                            nickname: nickname,
                            text: cmd,
                            timestamp: Date.now(),
                            type: 'chat'
                        });
                    } catch(e) { 
                        console.error(e); 
                        printChatLine({ type: 'system', text: `[경고] 서버 전송 실패! Firebase 콘솔에서 Firestore '규칙(Rules)'이 열려있는지 확인하세요.` });
                    }
                }
            }
        });

        document.body.addEventListener('click', (e) => {
            // 모바일에서 화면 아무곳이나 누를 때 키보드가 올라오는 불편함 방지
            // 하단 입력 영역을 직접 터치하거나 PC 환경일 때만 포커스 이동
            if (e.target.tagName !== 'INPUT' && !isDisconnected) {
                if (window.innerWidth > 768 || e.target.closest('#input-area')) {
                    ui.commandInput.focus();
                }
            }
        });

        init();

    </script>
</body>
</html>
