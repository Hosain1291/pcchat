<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Way PC통신</title>
<meta name="description" content="My Way PC통신 - PC통신 시절 화면을 고증한 실시간 대화방 · 게시판 · 동호회 · 한줄메모">
<style>
/* ───────────── 글꼴 ───────────── */
@font-face {
    font-family: 'RoundedFixedsys';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
    font-weight: normal;
    font-display: swap;
}
@font-face {
    font-family: 'Seogung';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-4@1.1/Suhgung12.woff2') format('woff2');
    font-weight: normal;
    font-display: swap;
}
@font-face {
    font-family: 'Umdot';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-4@1.1/Umdot12.woff2') format('woff2');
    font-weight: normal;
    font-display: swap;
}
@font-face {
    font-family: 'Tangba';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-4@1.1/Tangba12.woff2') format('woff2');
    font-weight: normal;
    font-display: swap;
}
@font-face {
    font-family: 'StoryBold';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2512-1@1.0/IyagiGGC.woff') format('woff');
    font-weight: normal;
    font-display: swap;
}

/* ───────────── 테마 (색상 토큰) ───────────── */
:root, [data-theme="blue"] {
    --bg:#0000AA; --fg:#E8E8E8; --hi:#FFFFFF; --dim:#9C9CD8;
    --c1:#55FFFF; --c2:#FFFF55; --c3:#55FF55; --c4:#FF5555; --c5:#FF55FF;
    --bar-bg:#AAAAAA; --bar-fg:#000000;
    --fkn-bg:#000000; --fkn-fg:#FFFFFF; --fkl-bg:#00AAAA; --fkl-fg:#000000;
    --sel-bg:#00AAAA; --sel-fg:#000000; --shadow:#000044; --glow:rgba(255,255,255,.35);
}
[data-theme="black"] {
    --bg:#000000; --fg:#C0C0C0; --hi:#FFFFFF; --dim:#7A7A7A;
    --c1:#55FFFF; --c2:#FFFF55; --c3:#55FF55; --c4:#FF5555; --c5:#FF55FF;
    --bar-bg:#0000AA; --bar-fg:#FFFFFF;
    --fkn-bg:#000000; --fkn-fg:#FFFFFF; --fkl-bg:#AAAAAA; --fkl-fg:#000000;
    --sel-bg:#0000AA; --sel-fg:#FFFFFF; --shadow:#333333; --glow:rgba(200,200,200,.3);
}
[data-theme="green"] {
    --bg:#021006; --fg:#33FF66; --hi:#C4FFD2; --dim:#1D8A3B;
    --c1:#8CFFA8; --c2:#D6FFE0; --c3:#33FF66; --c4:#A8FFBC; --c5:#8CFFA8;
    --bar-bg:#33FF66; --bar-fg:#021006;
    --fkn-bg:#021006; --fkn-fg:#C4FFD2; --fkl-bg:#1D8A3B; --fkl-fg:#021006;
    --sel-bg:#33FF66; --sel-fg:#021006; --shadow:#00300C; --glow:rgba(51,255,102,.6);
}
[data-theme="amber"] {
    --bg:#140B00; --fg:#FFB000; --hi:#FFE2A6; --dim:#9C6B00;
    --c1:#FFC94D; --c2:#FFE2A6; --c3:#FFB000; --c4:#FFD27A; --c5:#FFC94D;
    --bar-bg:#FFB000; --bar-fg:#140B00;
    --fkn-bg:#140B00; --fkn-fg:#FFE2A6; --fkl-bg:#9C6B00; --fkl-fg:#140B00;
    --sel-bg:#FFB000; --sel-fg:#140B00; --shadow:#3A2200; --glow:rgba(255,176,0,.6);
}
[data-theme="lcd"] {
    --bg:#A9B591; --fg:#1F2A1A; --hi:#0A1008; --dim:#55644A;
    --c1:#18301A; --c2:#0A1008; --c3:#2C3F26; --c4:#0A1008; --c5:#2C3F26;
    --bar-bg:#1F2A1A; --bar-fg:#A9B591;
    --fkn-bg:#1F2A1A; --fkn-fg:#A9B591; --fkl-bg:#8C9A74; --fkl-fg:#0A1008;
    --sel-bg:#1F2A1A; --sel-fg:#A9B591; --shadow:#7D8A66; --glow:rgba(0,0,0,0);
}
[data-theme="win31"] {
    --bg:#FFFFFF; --fg:#000000; --hi:#000000; --dim:#808080;
    --c1:#000080; --c2:#800000; --c3:#007000; --c4:#C00000; --c5:#800080;
    --bar-bg:#000080; --bar-fg:#FFFFFF;
    --fkn-bg:#C0C0C0; --fkn-fg:#000080; --fkl-bg:#C0C0C0; --fkl-fg:#000000;
    --sel-bg:#000080; --sel-fg:#FFFFFF; --shadow:#808080; --glow:rgba(0,0,0,0);
}

:root { --font:'RoundedFixedsys'; --fs:18px; --scale:1; }

* { box-sizing:border-box; }
html, body { height:100%; }
body {
    margin:0; height:100vh; height:100dvh; overflow:hidden;
    background:var(--bg); color:var(--fg);
    font-family:var(--font), 'RoundedFixedsys', monospace;
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:none; font-smooth:never;
}
button, input { font:inherit; color:inherit; }

#monitor { width:100%; height:100%; display:flex; flex-direction:column; position:relative; }
#crt {
    position:relative; flex:1; min-height:0; overflow:hidden;
    display:flex; flex-direction:column;
    background:var(--bg); color:var(--fg);
    font-size:calc(var(--fs) * var(--scale)); line-height:1.45; letter-spacing:.5px;
}
.badge, .led { display:none; }

/* CRT 효과 */
#crt::after {
    content:""; position:absolute; inset:0; pointer-events:none; z-index:50;
    opacity:0; transition:opacity .2s;
    background:
        repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.35) 100%);
}
.crt-on #crt::after { opacity:1; }
.crt-on #crt { text-shadow:0 0 3px var(--glow); }

/* 상단 바 */
#topbar {
    display:flex; justify-content:space-between; gap:1em; white-space:nowrap;
    background:var(--bar-bg); color:var(--bar-fg); padding:.05em .6em;
}
#topbar .l, #topbar .r { overflow:hidden; text-overflow:ellipsis; }
#topbar .l { flex:1; min-width:0; }
#topbar .r { flex:none; }
#topbar .svc { font-weight:bold; }

/* 화면 */
#screen {
    flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;
    padding:.5em .9em; white-space:normal; word-break:break-all;
    scrollbar-width:none;
}
#screen::-webkit-scrollbar { display:none; }

#flash { min-height:0; padding:0 .9em; color:var(--c4); }
#flash:empty { display:none; }
#flash.ok { color:var(--c3); }

#inrow {
    display:flex; align-items:center; gap:.6em; padding:.15em .9em .25em;
    border-top:1px solid var(--dim);
}
#prompt { color:var(--c1); white-space:nowrap; }
#cmd {
    flex:1; min-width:4em; background:transparent; border:0; outline:0;
    color:var(--hi); caret-color:var(--hi); font-size:1em; letter-spacing:.5px; padding:0;
}
#cmd:disabled { opacity:.4; }

/* 펑션키 바 (노턴 커맨더식) */
#fkeys { display:flex; overflow-x:auto; scrollbar-width:none; white-space:nowrap; background:var(--fkn-bg); }
#fkeys::-webkit-scrollbar { display:none; }
#fkeys button {
    flex:1 0 auto; display:flex; border:0; padding:0; margin:0 1px 0 0; cursor:pointer;
    background:var(--fkl-bg); color:var(--fkl-fg); font-size:.85em;
}
#fkeys button b { background:var(--fkn-bg); color:var(--fkn-fg); padding:0 .25em 0 .35em; font-weight:normal; }
#fkeys button span { padding:0 .5em 0 .25em; flex:1; text-align:left; }
#fkeys button:hover span, #fkeys button:focus-visible span { background:var(--sel-bg); color:var(--sel-fg); }
[data-theme="win31"] #fkeys { background:#808080; padding:2px; gap:2px; }
[data-theme="win31"] #fkeys button { border:2px outset #FFFFFF; margin:0; }
[data-theme="win31"] #fkeys button:active { border-style:inset; }

/* 상태줄 (통신 프로그램 하단줄) */
#status {
    display:flex; white-space:nowrap; overflow:hidden; font-size:.8em;
    background:var(--bar-bg); color:var(--bar-fg);
}
#status > span { padding:0 .7em; border-right:1px solid currentColor; }
#status > span:last-child { border-right:0; margin-left:auto; }

/* 팝업 */
#popup {
    position:absolute; inset:0; z-index:40; display:none;
    align-items:center; justify-content:center; padding:1em;
    background:color-mix(in srgb, var(--bg) 70%, transparent);
}
#popup.on { display:flex; }

/* ───────────── 공통 화면 요소 ───────────── */
.c1{color:var(--c1)} .c2{color:var(--c2)} .c3{color:var(--c3)} .c4{color:var(--c4)} .c5{color:var(--c5)}
.hi{color:var(--hi)} .dim{color:var(--dim)}
.inv { background:var(--hi); color:var(--bg); padding:0 .35em; }
.center { text-align:center; }
.rule { white-space:nowrap; overflow:hidden; color:var(--dim); line-height:1.1; margin:.35em 0; user-select:none; }
.rule.c1 { color:var(--c1); } .rule.c3 { color:var(--c3); }
.pre { white-space:pre-wrap; }
.gap { height:.7em; }
.ttl { color:var(--c2); }
.hint { color:var(--dim); margin-top:.4em; }
.hint .k { color:var(--c2); }

.box {
    position:relative; border:4px double var(--fg); padding:1.1em 1.2em .9em;
    background:var(--bg); box-shadow:.5em .5em 0 var(--shadow); max-width:36em; margin:1em auto;
}
.box > .cap {
    position:absolute; top:-.8em; left:50%; transform:translateX(-50%);
    background:var(--bg); color:var(--c2); padding:0 .6em; white-space:nowrap;
}

/* 블록 로고 */
.logo-wrap { text-align:center; margin:.6em 0 .2em; }
.logo {
    --cell:clamp(4px, calc((100vw - 60px) / 42), 11px);
    display:inline-grid; gap:1px; grid-auto-rows:var(--cell);
}
.logo i { display:block; width:var(--cell); }
.logo i.on { background:var(--hi); box-shadow:2px 2px 0 var(--shadow); }
.logo i.on.lo { background:var(--c1); }
.tagline { text-align:center; color:var(--c1); letter-spacing:.35em; margin:.5em 0 .2em; }

/* 메뉴 */
.menu { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:.1em 2.2em; max-width:40em; margin:.3em auto; }
.menu.one { grid-template-columns:minmax(0,1fr); max-width:34em; }
.mi { display:flex; gap:.6em; padding:.05em .5em; cursor:pointer; align-items:baseline; }
.mi .k { color:var(--c2); min-width:1.6em; }
.mi .code { margin-left:auto; color:var(--dim); font-size:.85em; }
.mi .sub { color:var(--dim); font-size:.85em; }
.mi:hover, .mi:focus-visible { background:var(--sel-bg); color:var(--sel-fg); outline:0; }
.mi:hover *, .mi:focus-visible * { color:inherit; }
.mi.cur .code { color:var(--c3); }

/* 게시판 목록 */
.bt .r {
    display:grid; grid-template-columns:3.6em 7.5em 3.6em 3.2em minmax(0,1fr);
    gap:0 .7em; padding:0 .4em; cursor:pointer;
}
.bt .r > span { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.bt .r .no, .bt .r .vw { text-align:right; }
.bt .hd { background:var(--bar-bg); color:var(--bar-fg); cursor:default; }
.bt .hd > span { color:inherit !important; }
#screen a { color:var(--c1); }
#screen a:hover { background:var(--sel-bg); color:var(--sel-fg); }
.bt .r:not(.hd):hover { background:var(--sel-bg); color:var(--sel-fg); }
.bt .r:not(.hd):hover * { color:inherit; }
.bt .au { color:var(--c1); }
.bt .dt { color:var(--dim); }
.bt .cc { color:var(--c3); }
.bt .empty { padding:.6em .4em; color:var(--dim); }

/* 글 읽기 */
.ph .lab { color:var(--c2); display:inline-block; min-width:3.6em; }
.ph div { margin:.05em 0; }
.post-b { white-space:pre-wrap; padding:.3em .2em; color:var(--hi); }
.cm { padding-left:.4em; }
.cm .nm { color:var(--c1); }
.cm .when { color:var(--dim); font-size:.85em; }

/* 대화 */
.cl .t { color:var(--dim); font-size:.85em; }
.cl .nm { color:var(--c1); }
.cl .nm.me { color:var(--c2); }
.sys { color:var(--c3); }
.sys.local { color:var(--c2); }

/* 편집기 */
.ln { display:flex; gap:.6em; }
.ln .no { color:var(--dim); min-width:2.4em; text-align:right; flex:none; }
.ln .tx { white-space:pre-wrap; }

/* 표 */
.tbl .r { display:grid; grid-template-columns:2.6em minmax(6em,10em) minmax(0,1fr) 5.5em; gap:0 .8em; padding:0 .4em; }
.tbl .hd { background:var(--bar-bg); color:var(--bar-fg); }
.tbl .r > span { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }

.sw { display:inline-block; padding:0 .5em; border:1px solid var(--dim); min-width:5.2em; text-align:center; }
.kv { display:grid; grid-template-columns:9em minmax(0,1fr); gap:.1em 1em; max-width:36em; margin:0 auto; }
.kv .k { color:var(--c2); }
.memo { display:flex; gap:.6em; }
.memo .when { color:var(--dim); flex:none; font-size:.85em; padding-top:.1em; }
.memo .nm { color:var(--c1); flex:none; }

/* 자료실 · 전송 화면 */
.xfer { border:4px double var(--c1); padding:.8em 1em; margin:.8em 0; max-width:36em; position:relative; }
.xfer .cap { position:absolute; top:-.8em; left:1em; background:var(--bg); color:var(--c1); padding:0 .5em; }
.xfer .bar { color:var(--c3); white-space:nowrap; overflow:hidden; letter-spacing:0; }
.xfer .err { color:var(--c4); }
.orig { display:block; max-width:min(100%, 720px); max-height:60vh; object-fit:contain; border:2px solid var(--dim); margin:.4em 0; cursor:zoom-in; }
.ansi { cursor:zoom-in; display:block; max-width:100%; image-rendering:pixelated; image-rendering:crisp-edges; border:2px solid var(--dim); margin:.4em 0; }
.pickbtn { background:var(--sel-bg); color:var(--sel-fg); border:0; padding:.1em .8em; cursor:pointer; margin-top:.5em; }
.viewer { background:#000; border:4px double #AAAAAA; padding:.5em; max-width:96%; max-height:92%; display:flex; flex-direction:column; color:#AAAAAA; box-shadow:.5em .5em 0 rgba(0,0,0,.6); }
.viewer .vt { background:#AAAAAA; color:#000; padding:0 .5em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.viewer img { max-width:100%; max-height:calc(100dvh - 9em); object-fit:contain; display:block; margin:.5em auto; image-rendering:auto; }
.viewer .vf { text-align:center; font-size:.85em; }
.bt.pds .r { grid-template-columns:3.6em 7em 3.6em 5.2em 3em minmax(0,1fr); }
.bt .sz { text-align:right; color:var(--dim); }

/* ───────────── 반응형 ───────────── */
@media (max-width:720px) {
    :root { --fs:15px; }
    #screen { padding:.4em .6em; }
    #inrow { padding:.15em .6em .3em; }
    #topbar .r .code, #status .opt { display:none; }
    .menu { grid-template-columns:minmax(0,1fr); gap:.05em; }
    .bt .r { grid-template-columns:2.8em 3.2em minmax(0,1fr); gap:0 .5em; }
    .bt .r .au, .bt .r .vw { display:none; }
    .bt.pds .r { grid-template-columns:2.8em 3.2em 4.6em minmax(0,1fr); }
    .bt.pds .r .dt { order:1; } .bt.pds .r .sz { order:2; } .bt.pds .r .ti { order:3; }
    .bt .r .dt { order:1; } .bt .r .ti { order:2; } .bt .r .no { order:0; }
    .tbl .r { grid-template-columns:2em minmax(0,1fr) 4.2em; }
    .tbl .r .wh { display:none; }
    .kv { grid-template-columns:6.5em minmax(0,1fr); }
    .box { padding:1em .8em .7em; }
}

@media (min-width:900px) and (min-height:620px) {
    :root { --fs:19px; }
    body { background:radial-gradient(ellipse at 50% 35%, #3b3a36, #121211 75%); padding:26px; }
    #monitor {
        width:min(1040px, 100%); height:min(820px, 100%);
        background:linear-gradient(#DCD5C2, #C3BBA4);
        border-radius:22px; padding:26px 26px 46px;
        box-shadow:inset 0 2px 0 #F1ECDF, inset 0 -4px 0 #A29A83, 0 24px 60px rgba(0,0,0,.65);
    }
    #crt { border-radius:12px; box-shadow:0 0 0 3px #22211E, 0 0 0 6px #8F8874; }
    .badge {
        display:block; position:absolute; left:34px; bottom:14px;
        font-family:'RoundedFixedsys', monospace; font-size:13px; color:#77705C; letter-spacing:2px;
    }
    .led {
        display:block; position:absolute; right:38px; bottom:19px; width:9px; height:9px; border-radius:50%;
        background:#4CFF6A; box-shadow:0 0 6px #4CFF6A;
    }
    .led.off { background:#FFA530; box-shadow:0 0 6px #FFA530; }
}
</style>
</head>

<div id="monitor">

        <div id="screen" aria-live="polite"></div>

        <div id="inrow">
            <label id="prompt" for="cmd">&gt;&gt;</label>

/* 작업 n개를 동시에 limit개씩 처리 */
async function pool(n, limit, fn) {
    let next = 0;
    const worker = async () => { while (next < n) { const i = next++; await fn(i); } };
    await Promise.all(Array.from({ length:Math.min(limit, n) }, worker));
}
function makeRemote(F, db, uid) {
    const col = (...p) => F.collection(db, ...p);
    const ref = (...p) => F.doc(db, ...p);
    const rows = s => s.docs.map(d => ({ id:d.id, ...d.data() }));
    return {
        online: true, uid,
        subChat(room, cb, err) {
            const q = F.query(col('chat_rooms', room, 'messages'), F.orderBy('timestamp'), F.limitToLast(100));
            return F.onSnapshot(q, snap => {
                snap.docChanges().forEach(ch => { if (ch.type === 'added') cb({ id:ch.doc.id, ...ch.doc.data() }); });
            }, err);
        },
        sendChat(room, m) { return F.addDoc(col('chat_rooms', room, 'messages'), { ...m, timestamp:Date.now() }); },
        async listPosts(b) { return rows(await F.getDocs(F.query(col('boards', b, 'posts'), F.orderBy('timestamp','desc'), F.limit(300)))); },
        async getPost(b, id) { const d = await F.getDoc(ref('boards', b, 'posts', id)); return d.exists() ? { id:d.id, ...d.data() } : null; },
        addPost(b, p) { return F.addDoc(col('boards', b, 'posts'), { ...p, uid, views:0, comments:0, timestamp:Date.now() }); },
        delPost(b, id) { return F.deleteDoc(ref('boards', b, 'posts', id)); },
        incView(b, id) { return F.updateDoc(ref('boards', b, 'posts', id), { views:F.increment(1) }).catch(() => {}); },
        async listComments(b, id) { return rows(await F.getDocs(F.query(col('boards', b, 'posts', id, 'comments'), F.orderBy('timestamp')))); },
        async addComment(b, id, c) {
            await F.addDoc(col('boards', b, 'posts', id, 'comments'), { ...c, uid, timestamp:Date.now() });
            F.updateDoc(ref('boards', b, 'posts', id), { comments:F.increment(1) }).catch(() => {});
        },
        async listMemos() { return rows(await F.getDocs(F.query(col('memos'), F.orderBy('timestamp','desc'), F.limit(40)))); },
        addMemo(m) { return F.addDoc(col('memos'), { ...m, uid, timestamp:Date.now() }); },
        setPresence(p) { return F.setDoc(ref('presence', uid), { ...p, lastSeen:Date.now() }).catch(() => {}); },
        delPresence() { return F.deleteDoc(ref('presence', uid)).catch(() => {}); },
        async listWho() { return rows(await F.getDocs(F.query(col('presence'), F.where('lastSeen', '>', Date.now() - 3*60*1000)))); },
        /* 회원이 만든 동호회 */
        async listClubs() { return rows(await F.getDocs(F.query(col('clubs'), F.orderBy('timestamp')))); },
        addClub(id, c) { return F.setDoc(ref('clubs', id), { ...c, owner:uid, timestamp:Date.now() }); },
        delClub(id) { return F.deleteDoc(ref('clubs', id)); },
        /* 자료실: 파일을 base64 조각으로 나눠 Firestore 에 저장 */
        newFileId(area) { return F.doc(col('pds', area, 'items')).id; },
        async putFile(area, id, meta, chunks, prog) {
            let done = 0;
            await pool(chunks.length, 4, async i => {
                await F.setDoc(ref('pds', area, 'items', id, 'chunks', String(i)), { data:chunks[i] });
                prog(++done, chunks.length);
            });
            await F.setDoc(ref('pds', area, 'items', id), { ...meta, uid, downloads:0, chunks:chunks.length, timestamp:Date.now() });
        },
        async listFiles(area) { return rows(await F.getDocs(F.query(col('pds', area, 'items'), F.orderBy('timestamp','desc'), F.limit(200)))); },
        async getFile(area, id) { const d = await F.getDoc(ref('pds', area, 'items', id)); return d.exists() ? { id:d.id, ...d.data() } : null; },
        async getChunks(area, id, n, prog) {
            const out = new Array(n);
            let done = 0;
            await pool(n, 4, async i => {
                const d = await F.getDoc(ref('pds', area, 'items', id, 'chunks', String(i)));
                if (!d.exists()) throw new Error('자료 조각이 없습니다');
                out[i] = d.data().data; prog(++done, n);
            });
            return out.join('');
        },
        incDown(area, id) { return F.updateDoc(ref('pds', area, 'items', id), { downloads:F.increment(1) }).catch(() => {}); },
        async delFile(area, id, n) {
            await pool(n, 4, i => F.deleteDoc(ref('pds', area, 'items', id, 'chunks', String(i))).catch(() => {}));
            await F.deleteDoc(ref('pds', area, 'items', id));
        }
    };
}

function makeLocal(uid = 'local') {
    const t0 = Date.now();
    const chats = {}, subs = {}, posts = {}, comments = {}, files = {}, clubs = [];
    let seq = 0; const nid = () => 'L' + (++seq);
    let me = null;
    posts.free = [
        { id:nid(), title:'오프라인 모드로 동작 중입니다', author:'운영자', body:'서버에 연결하지 못해 이 컴퓨터 안에서만 동작합니다.\n쓴 글은 새로고침하면 사라집니다.', uid:'sys', views:3, comments:0, timestamp:t0 - 3600e3 }
    ];
    const memos = [{ id:nid(), nick:'운영자', text:'오프라인 모드 - 남긴 메모는 이 화면에서만 보입니다.', timestamp:t0 - 600e3 }];
    return {
        online: false, uid,
        subChat(room, cb) {
            (chats[room] ||= []).forEach(cb);
            (subs[room] ||= new Set()).add(cb);
            return () => subs[room].delete(cb);
        },
        async sendChat(room, m) {
            const msg = { id:nid(), ...m, timestamp:Date.now() };
            (chats[room] ||= []).push(msg); (subs[room] || []).forEach(f => f(msg));
        },
        async listPosts(b) { return [...(posts[b] || [])].sort((a, z) => z.timestamp - a.timestamp); },
        async getPost(b, id) { return (posts[b] || []).find(p => p.id === id) || null; },
        async addPost(b, p) { (posts[b] ||= []).push({ id:nid(), ...p, uid, views:0, comments:0, timestamp:Date.now() }); },
        async delPost(b, id) { posts[b] = (posts[b] || []).filter(p => p.id !== id); },
        async incView(b, id) { const p = (posts[b] || []).find(p => p.id === id); if (p) p.views++; },
        async listComments(b, id) { return [...(comments[b+id] || [])]; },
        async addComment(b, id, c) {
            (comments[b+id] ||= []).push({ id:nid(), ...c, uid, timestamp:Date.now() });
            const p = (posts[b] || []).find(p => p.id === id); if (p) p.comments++;
        },
        async listMemos() { return [...memos].sort((a, z) => z.timestamp - a.timestamp); },
        async addMemo(m) { memos.push({ id:nid(), ...m, uid, timestamp:Date.now() }); },
        async setPresence(p) { me = { id:uid, ...p, lastSeen:Date.now() }; },
        async delPresence() { me = null; },
        async listWho() { return me ? [me] : []; },
        async listClubs() { return [...clubs]; },
        async addClub(id, c) { if (clubs.find(x => x.id === id)) throw { code:'permission-denied' }; clubs.push({ id, ...c, owner:uid, timestamp:Date.now() }); },
        async delClub(id) { const i = clubs.findIndex(x => x.id === id); if (i >= 0) clubs.splice(i, 1); },
        newFileId() { return nid(); },
        async putFile(area, id, meta, chunks, prog) {
            for (let i = 0; i < chunks.length; i++) { await sleep(120); prog(i + 1, chunks.length); }
            (files[area] ||= []).push({ id, ...meta, uid, downloads:0, chunks:chunks.length, timestamp:Date.now(), _data:chunks.join('') });
        },
        async listFiles(area) { return [...(files[area] || [])].sort((a, z) => z.timestamp - a.timestamp); },
        async getFile(area, id) { return (files[area] || []).find(f => f.id === id) || null; },
        async getChunks(area, id, n, prog) { await sleep(150); prog(n, n); return ((files[area] || []).find(f => f.id === id) || {})._data || ''; },
        async incDown(area, id) { const f = (files[area] || []).find(f => f.id === id); if (f) f.downloads++; },
        async delFile(area, id) { files[area] = (files[area] || []).filter(f => f.id !== id); }
    };
}

/* ── 회원 인증 ──
   이용자는 대화명(닉네임)과 비밀번호만 입력합니다. 이메일은 묻지도 쓰지도 않습니다.
   내부적으로는 대화명을 글자 그대로(대·소문자, 한글 구분) 16진수로 바꾼 가짜 계정 주소를
   Firebase 인증의 열쇠로만 씁니다. 그래서 대화명·비밀번호가 한 글자라도 다르면 틀립니다. */
const ID_RE = /^[A-Za-z0-9_가-힣]{2,10}$/;
const idToEmail = id => [...new TextEncoder().encode(id)].map(b => b.toString(16).padStart(2, '0')).join('') + '@myway-pc.local';
async function hashPw(id, pw) {
    const data = new TextEncoder().encode('myway|' + id + '|' + pw);
    try { return [...new Uint8Array(await crypto.subtle.digest('SHA-256', data))].map(b => b.toString(16).padStart(2, '0')).join(''); }
    catch (e) { let h = 0; for (const b of data) h = (h * 31 + b) >>> 0; return 'x' + h.toString(16); }
}
const authErr = code => ({ code });

const AUTH = {
    async login(id, pw) {
        if (NET) {
            const cred = await withTimeout(NET.Au.signInWithEmailAndPassword(NET.auth, idToEmail(id), pw), 15000);
            return { uid:cred.user.uid, id, nick:cred.user.displayName || id, guest:false };
        }
        const acc = LS.get('accounts', {})[id];
        if (!acc || acc.pw !== await hashPw(id, pw)) throw authErr('auth/invalid-credential');
        return { uid:'local-' + id, id, nick:acc.nick, guest:false };
    },
    async signup(id, pw) {
        const nick = id;
        if (NET) {
            const cred = await withTimeout(NET.Au.createUserWithEmailAndPassword(NET.auth, idToEmail(id), pw), 15000);
            await NET.Au.updateProfile(cred.user, { displayName:nick }).catch(() => {});
            return { uid:cred.user.uid, id, nick, guest:false };
        }
        const accs = LS.get('accounts', {});
        if (accs[id]) throw authErr('auth/email-already-in-use');
        accs[id] = { nick, pw:await hashPw(id, pw) };
        LS.set('accounts', accs);
        return { uid:'local-' + id, id, nick, guest:false };
    },
    async guest() {
        const nick = '손님_' + Math.floor(Math.random() * 9000 + 1000);
        if (NET) {
            const cred = await withTimeout(NET.Au.signInAnonymously(NET.auth), 15000);
            return { uid:cred.user.uid, id:'guest', nick, guest:true };
        }
        return { uid:'local-guest', id:'guest', nick, guest:true };
    },
    logout() { if (NET) NET.Au.signOut(NET.auth).catch(() => {}); }
};
function authMessage(e) {
    const c = (e && e.code) || '';
    if (['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found', 'auth/invalid-email', 'auth/invalid-login-credentials'].includes(c))
        return '대화명 또는 비밀번호가 틀립니다.';
    if (c === 'auth/email-already-in-use') return '이미 누가 쓰고 있는 대화명입니다.';
    if (c === 'auth/weak-password') return '비밀번호는 6자 이상이어야 합니다.';
    if (c === 'auth/too-many-requests') return '너무 여러 번 틀렸습니다. 잠시 뒤에 다시 시도하세요.';
    if (c === 'auth/operation-not-allowed' || c === 'auth/admin-restricted-operation')
        return '서버에서 이 로그인 방식이 꺼져 있습니다. (운영자: Firebase 인증 설정 필요)';
    if (c === 'auth/network-request-failed' || (e && e.message === 'timeout')) return '통신 상태가 좋지 않습니다. 다시 시도하세요.';
    return '로그인 오류: ' + (c || (e && e.message) || e);
}

    } catch (e) { S.clubErr = e; }
    return S.userClubs;
}

function goCode(code) {
    const key = (code || '').toLowerCase().trim();
    const uc = S.userClubs.find(c => c.code.toLowerCase() === key);
    if (uc && !GO[key]) { nav('clubHome', { id:uc.id }); return; }
    const g = GO[key];
    if (!g) { flash(`[${code}] 은(는) 없는 GO 코드입니다. (H: 도움말)`); return; }
    if (g[0] === 'main') top(); else nav(g[0], { ...(g[1] || {}) });
}

function globalCmd(v) {
    const l = v.toLowerCase();
    if (l === 'p' || l === '이전') { back(); return true; }
    if (l === 't' || l === 'top' || l === '처음') { top(); return true; }
    if (l === 'h' || l === '?' || l === 'help' || l === '도움말') { nav('help'); return true; }
    if (l === 'x' || l === 'bye' || l === '종료') { bye(); return true; }
    if (l.startsWith('go ')) { goCode(l.slice(3)); return true; }
    if (l === 'go') { flash('사용법: go 코드  (예: go free)'); return true; }
    return false;
}
function globalSlash(v) {
    const [c, ...r] = v.split(' ');
    const l = c.toLowerCase();
    if (l === '/p' || l === '/q' || l === '/quit') { back(); return true; }
    if (l === '/t') { top(); return true; }
    if (l === '/x' || l === '/bye') { bye(); return true; }
    if (l === '/go') { goCode(r.join(' ')); return true; }
    return false;
}

function handle(rawIn) {
    const raw = rawIn ?? '';
    const v = raw.trim();
    if (S.phase === 'dead') { location.reload(); return; }
    if (S.phase === 'boot') return;
    if (S.phase === 'popup') { closePopup(); return; }
    if (S.phase === 'login') { S.cur.onInput(raw); return; }
    if (!S.cur) return;
    if (v) { S.history.push(v); if (S.history.length > 50) S.history.shift(); }
    S.hIdx = -1;
    if (S.cur.raw) {
        if (v.startsWith('/') && globalSlash(v)) return;
        S.cur.onInput && S.cur.onInput(raw);
        return;
    }
    if (v && globalCmd(v)) return;
    S.cur.onInput && S.cur.onInput(v);
}

ui.cmd.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter') {
        e.preventDefault();
        const v = ui.cmd.value; ui.cmd.value = '';
        handle(v);
    } else if (e.key === 'ArrowUp' && S.history.length) {
        e.preventDefault();
        S.hIdx = S.hIdx < 0 ? S.history.length - 1 : Math.max(0, S.hIdx - 1);
        ui.cmd.value = S.history[S.hIdx];
    } else if (e.key === 'ArrowDown' && S.hIdx >= 0) {
        e.preventDefault();
        S.hIdx++;
        if (S.hIdx >= S.history.length) { S.hIdx = -1; ui.cmd.value = ''; } else ui.cmd.value = S.history[S.hIdx];
    }
});

function logo(word) {
    const letters = word.split('').map(c => FONT5[c]);
    const cols = letters.reduce((n, g) => n + g[0].length, 0) + letters.length - 1;
    let cells = '';
    for (let r = 0; r < 7; r++) {

            for (let c = 0; c < g[r].length; c++) cells += `<i class="${g[r][c] === '1' ? 'on' : ''}${r >= 4 ? ' lo' : ''}"></i>`;
            if (li < letters.length - 1) cells += '<i></i>';
        });
    }
    return `<div class="logo-wrap"><div class="logo" style="grid-template-columns:repeat(${cols}, var(--cell))" aria-label="${word}">${cells}</div></div>`;
}

screens.chat = ({ room }) => {
    room = cleanRoom(room);
    const R = roomInfo(room);
    const myId = S.navId;
    show({
        crumb:R.crumb, code:'CHAT', where:R.title, prompt:`${S.nick} >`, raw:true,
        html: `${rule('═', 'c3')}<div class="c2">통신망 ${esc(R.title)}에 오신 것을 환영합니다!</div>
<div class="c1">당신의 대화명은 [${esc(S.nick)}] 입니다. 명령어는 /h 를 입력하세요.</div>${rule('═', 'c3')}<div id="chatlog"></div>`
    });
    const log = $('#chatlog');
    const nearBottom = () => ui.screen.scrollHeight - ui.screen.scrollTop - ui.screen.clientHeight < 80;
    const append = html => {
        const stick = nearBottom();
        log.insertAdjacentHTML('beforeend', html);
        if (stick || log.childElementCount < 3) ui.screen.scrollTop = ui.screen.scrollHeight;
    };
    const items = [];
    const sys = t => { items.push({ type:'local', text:t }); append(`<div class="sys local">${esc(t)}</div>`); };
    const line = m => {
        if (m.type === 'system') return `<div class="sys">${esc(m.text)}</div>`;
        const me = m.nickname === S.nick;
        return `<div class="cl"><span class="t">${m.timestamp ? fmtHM(m.timestamp) : ''}</span> <span class="nm${me ? ' me' : ''}">[${esc(m.nickname)}]</span> ${esc(m.text)}</div>`;
    };
    const seen = new Set();
    const unsub = DB.subChat(room, m => {
        if (stale(myId) || seen.has(m.id)) return;
        seen.add(m.id); items.push(m); append(line(m));
    }, e => sys(errMsg(e).replace(/<[^>]+>/g, '')));
    DB.sendChat(room, { type:'system', text:`*** ${S.nick}님이 들어오셨습니다.`, nickname:S.nick }).catch(() => {});

    S.cur.saveImage = () => saveChatImage(R, items.filter(m => m.type !== 'local'));
    S.cur.onLeave = () => {
        unsub && unsub();
        DB.sendChat(room, { type:'system', text:`*** ${S.nick}님이 나가셨습니다.`, nickname:S.nick }).catch(() => {});
    };
    S.cur.onInput = async raw => {
        const v = raw.trim();
        if (!v) return;
        if (v.startsWith('/')) {
            const parts = v.split(' ');
            const c = parts[0].toLowerCase();
            const arg = parts.slice(1).join(' ').trim();
            if (c === '/j' || c === '/join') {
                if (arg) nav('chat', { room:cleanRoom(arg) }, { replace:true });
                else sys('사용법: /j 방이름  (예: /j 수다방)');
            } else if (c === '/n' || c === '/nick') {
                const old = S.nick;
                const r = setNick(arg);
                if (r === 'member') sys('회원 대화명은 로그인 이름이라 바꿀 수 없습니다. (손님만 /n 사용)');
                else if (r) {
                    setPrompt(`${S.nick} >`);
                    DB.sendChat(room, { type:'system', text:`*** ${old}님이 대화명을 [${S.nick}](으)로 바꾸셨습니다.`, nickname:S.nick }).catch(() => {});
                } else sys('사용법: /n 새대화명  (12자까지)');
            } else if (c === '/font') {
                const f = arg && findFont(arg);
                if (f) { applyFont(f.id); sys(`글꼴이 '${f.name}'(으)로 바뀌었습니다.`); }
                else sys(`사용법: /font ${FONTS.map(f => f.name).join('/')}`);
            } else if (c === '/theme') {
                const t = arg && findTheme(arg);
                if (t) { applyTheme(t.id); sys(`테마가 '${t.name}'(으)로 바뀌었습니다.`); }
                else sys('사용법: /theme 번호  ' + THEMES.map((t, i) => `${i+1}.${t.name}`).join(' '));
            } else if (c === '/cls' || c === '/clear') {
                log.innerHTML = ''; items.length = 0; sys('화면이 지워졌습니다.');
            } else if (c === '/w' || c === '/who') {
                try {
                    const list = await DB.listWho();
                    sys(`현재 접속자 ${list.length}명: ` + list.map(p => `${p.nick}(${p.where || '-'})`).join(', '));
                } catch(e) { sys(errMsg(e)); }
            } else if (c === '/save' || c === '/사진' || c === '/capture') {
                S.cur.saveImage();
            } else if (c === '/h' || c === '/help' || c === '/?') {

const PAGE = 15;
screens.board = async ({ b, page = 0 }, id) => {
    const B = boardInfo(b);
    show({ crumb:B.crumb, code:B.code, where:B.name, prompt:'번호/명령 >>', html:header(B.name) + loading(), onInput(){} });
    let posts;
    try { posts = await DB.listPosts(b); }
    catch (e) {
        if (stale(id)) return;
        show({ html: header(B.name) + `<div class="c4">${errMsg(e)}</div>${rule()}${navHint()}`, onInput(){} });
        return;
    }
    if (stale(id)) return;
    const total = posts.length;
    const pages = Math.max(1, Math.ceil(total / PAGE));
    let pg = Math.min(page, pages - 1);
    const render = () => {
        const slice = posts.slice(pg * PAGE, pg * PAGE + PAGE);
        const rows = slice.map((p, k) => {
            const no = total - (pg * PAGE + k);
            return `<div class="r" data-cmd="${no}" tabindex="0"><span class="no">${no}</span><span class="au">${esc(p.author)}</span><span class="dt">${fmtMD(p.timestamp)}</span><span class="vw">${p.views || 0}</span><span class="ti">${esc(p.title)}${p.comments ? ` <span class="cc">[${p.comments}]</span>` : ''}</span></div>`;
        }).join('');
        show({ html: header(B.name, `총 ${total}건 · ${pg+1}/${pages}쪽`) +
            `<div class="bt"><div class="r hd"><span class="no">번호</span><span class="au">글쓴이</span><span class="dt">날짜</span><span class="vw">조회</span><span class="ti">제목</span></div>${rows || '<div class="empty">아직 올라온 글이 없습니다. W 를 눌러 첫 글을 써 보세요.</div>'}</div>` +
            rule() + navHint('<span class="k">번호</span> 읽기 · <span class="k">W</span> 쓰기 · <span class="k">N</span>/<span class="k">B</span> 다음/앞 쪽 · <span class="k">L</span> 새로고침') });
    };
    render();
    S.cur.onInput = v => {
        const l = v.toLowerCase();
        if (/^\d+$/.test(v)) {
            const idx = total - +v;
            if (idx >= 0 && idx < total) nav('read', { b, id:posts[idx].id, list:posts.map(p => p.id) });
            else flash('없는 글 번호입니다.');
        }
        else if (l === 'w') nav('write', { b });
        else if (l === 'n') { if (pg < pages - 1) { pg++; setParams({ page:pg }); render(); } else flash('마지막 쪽입니다.'); }
        else if (l === 'b') { if (pg > 0) { pg--; setParams({ page:pg }); render(); } else flash('첫 쪽입니다.'); }
        else if (l === 'l' || v === '') nav('board', { b, page:pg }, { replace:true });
        else flash('번호 · W 쓰기 · N/B 쪽 넘김 · P 이전');
    };
};

screens.read = async ({ b, id: pid, list = [] }, id) => {
    const B = boardInfo(b);
    show({ crumb:[...B.crumb, '읽기'], code:B.code, where:B.name, prompt:'명령 >>', html:loading(), onInput(){} });
    let post, cms;
    try {
        if (!S.cur.viewed) { DB.incView(b, pid); S.cur.viewed = true; }
        [post, cms] = await Promise.all([DB.getPost(b, pid), DB.listComments(b, pid)]);
    } catch (e) {
        if (stale(id)) return;
        show({ html:`<div class="c4">${errMsg(e)}</div>${navHint()}` }); return;
    }
    if (stale(id)) return;
    if (!post) { show({ html:`<div class="c4">삭제되었거나 없는 글입니다.</div>${navHint()}` }); return; }
    const idx = list.indexOf(pid);
    const mine = post.uid && post.uid === DB.uid;
    const no = list.length ? list.length - idx : '';
    show({
        html: `<div class="ph">
<div><span class="lab">제 목</span>: <span class="hi">${esc(post.title)}</span></div>
<div><span class="lab">글쓴이</span>: <span class="c1">${esc(post.author)}</span> &nbsp; <span class="lab">날짜</span>: ${fmtFull(post.timestamp)} &nbsp; <span class="lab">조회</span>: ${Math.max(1, post.views || 0)}${no ? ` &nbsp; <span class="lab">번호</span>: ${no}` : ''}</div>
</div>${rule()}<div class="post-b">${esc(post.body)}</div>${rule()}
<div class="ttl">댓글 ${cms.length}개</div>
${cms.map(c => `<div class="cm">└ <span class="nm">[${esc(c.author)}]</span> ${esc(c.text)} <span class="when">${fmtMD(c.timestamp)} ${fmtHM(c.timestamp)}</span></div>`).join('') || '<div class="cm dim">└ 아직 댓글이 없습니다.</div>'}
${rule()}${navHint(`<span class="k">C</span> 댓글 · <span class="k">N</span> 다음글 · <span class="k">A</span> 앞글${mine ? ' · <span class="k">D</span> 삭제' : ''} · <span class="k">L</span> 목록`)}`
    });
    const go = j => nav('read', { b, id:list[j], list }, { replace:true });
    S.cur.onInput = async v => {
        const mode = S.cur.mode;
        if (mode === 'comment') {
            S.cur.mode = null; S.cur.raw = false; setPrompt('명령 >>');
            const t = v.trim();
            if (!t) return flash('댓글 쓰기를 취소했습니다.');
            try { await DB.addComment(b, pid, { author:S.nick, text:t.slice(0, 200) }); }
            catch (e) { return flash(errMsg(e)); }
            if (!stale(id)) { S.cur.viewed = true; screens.read({ b, id:pid, list }, id); }
            return;
        }
        if (mode === 'delete') {
            S.cur.mode = null; setPrompt('명령 >>');
            if (v.toLowerCase() !== 'y') return flash('삭제를 취소했습니다.');
            try { await DB.delPost(b, pid); flash('글을 지웠습니다.', true); back(); }
            catch (e) { flash(errMsg(e)); }
            return;
        }
        const l = v.toLowerCase();
        if (l === 'c') { S.cur.mode = 'comment'; S.cur.raw = true; setPrompt('댓글 >>'); flash('댓글을 입력하고 Enter (빈 줄이면 취소)', true); }
        else if (l === 'n') { if (idx >= 0 && idx < list.length - 1) go(idx + 1); else flash('마지막 글입니다.'); }
        else if (l === 'a') { if (idx > 0) go(idx - 1); else flash('가장 최근 글입니다.'); }
        else if (l === 'd' && mine) { S.cur.mode = 'delete'; setPrompt('정말 지울까요? (Y/N) >>'); }
        else if (l === 'l' || v === '') back();
        else flash('C 댓글 · N 다음글 · A 앞글 · L 목록 · P 이전');
    };
};

screens.write = ({ b }) => {
    const B = boardInfo(b);
    const st = { step:'title', title:'', lines:[] };
    const render = () => {
        const body = st.lines.map((t, i) => `<div class="ln"><span class="no">${i+1}:</span><span class="tx">${esc(t) || ' '}</span></div>`).join('');
        show({
            crumb:[...B.crumb, '쓰기'], code:B.code, where:`${B.name} (글 쓰는 중)`, raw:true,
            prompt: st.step === 'title' ? '제목 >>' : `${String(st.lines.length + 1).padStart(3, ' ')}:`,
            html: header(`${B.name} · 글 쓰기`) +
                (st.step === 'title'
                    ? `<div class="c1">제목을 입력하세요. (60자 이내, 빈 줄 Enter 는 취소)</div>`
                    : `<div class="ph"><div><span class="lab">제 목</span>: <span class="hi">${esc(st.title)}</span></div><div><span class="lab">글쓴이</span>: <span class="c1">${esc(S.nick)}</span></div></div>${rule()}` +
                      `<div class="c1">본문을 한 줄씩 입력하세요.</div>${body}${rule()}` +
                      `<div class="hint"><span class="k">/s</span> 저장 · <span class="k">/u</span> 마지막 줄 지우기 · <span class="k">/a</span> 취소 · 빈 줄도 그대로 들어갑니다</div>`)
        });
        ui.screen.scrollTop = ui.screen.scrollHeight;
    };
    render();
    S.cur.onInput = async raw => {
        const t = raw.trim();
        if (st.step === 'title') {
            if (!t) return back();
            st.title = t.slice(0, 60); st.step = 'body'; return render();
        }
        const l = t.toLowerCase();
        if (l === '/s' || t === '.') {
            if (!st.lines.join('').trim()) return flash('본문이 비어 있습니다.');
            setPrompt('저장 중 ...');
            try {
                await DB.addPost(b, { title:st.title, body:st.lines.join('\n').slice(0, 8000), author:S.nick });
                flash('글이 올라갔습니다.', true); back();
            } catch (e) { flash(errMsg(e)); render(); }
        } else if (l === '/a') { flash('글 쓰기를 취소했습니다.'); back(); }
        else if (l === '/u') { st.lines.pop(); render(); }
        else if (st.lines.length >= 200) flash('200줄까지 쓸 수 있습니다. /s 로 저장하세요.');
        else { st.lines.push(raw.replace(/\s+$/, '').slice(0, 200)); render(); }
    };
};

screens.clubNew = () => {
    const crumb = ['동호회', '동호회 개설'];

            onInput(v) { if (v === '') back(); } });
        return;
    }
    const st = { step:'name', name:'', code:'', intro:'' };
    const render = () => {
        const prompts = { name:'동호회 이름 >>', code:'GO 코드 >>', intro:'소개 >>', ok:'개설할까요? (Y/N) >>' };
        const guide = {
            name:'동호회 이름을 정하세요. (2~12자)',
            code:'바로 가기용 GO 코드를 정하세요. 영문 · 숫자 2~8자 (예: ANIME → go anime)',
            intro:'동호회를 한 줄로 소개해 주세요. (40자 이내)',
            ok:'이대로 만들까요? Y 개설 · N 취소'
        };
        show({ crumb, code:'CLUB', where:'동호회 개설', raw:true, prompt:prompts[st.step],
            html: header('동 호 회 개 설', '만든 사람이 시삽이 되어 폐쇄도 할 수 있습니다') +
                `<div class="ph">
<div><span class="lab">이름</span>: <span class="hi">${esc(st.name) || '<span class="dim">-</span>'}</span></div>
<div><span class="lab">GO 코드</span>: <span class="c2">${esc(st.code) || '<span class="dim">-</span>'}</span></div>
<div><span class="lab">소개</span>: ${esc(st.intro) || '<span class="dim">-</span>'}</div>
<div><span class="lab">시삽</span>: <span class="c1">${esc(S.nick)}</span></div></div>${rule()}
<div class="c1">${guide[st.step]}</div><div class="hint">빈 줄 Enter 또는 <span class="k">/a</span> 는 취소</div>` });
    };
    render();
    S.cur.onInput = async raw => {

        if (st.step === 'code') {

            if (!/^[A-Z0-9]{2,8}$/.test(code)) return flash('GO 코드는 영문 · 숫자 2~8자입니다.');

            nav('clubHome', { id:cid }, { replace:true });

};

async function saveChatImage(R, items) {
    const cs = getComputedStyle(ui.root);
    const col = n => cs.getPropertyValue('--' + n).trim();
    const fam = (FONTS.find(f => f.id === S.fontId) || FONTS[0]).css;
    const FS = 20, LH = 30, W = 900, PX = 32, BAR = 34;
    const font = `${FS}px ${fam}, monospace`;
    try { await document.fonts.load(font, '가A'); } catch (e) {}
    const cv = document.createElement('canvas');
    const ctx = cv.getContext('2d');
    ctx.font = font;
    const maxW = W - PX * 2;
    const lines = [];
    const addWrapped = segs => {
        let line = [], w = 0;
        for (const sg of segs) for (const ch of [...sg.t]) {
            const cw = ctx.measureText(ch).width;
            if (w + cw > maxW && line.length) { lines.push(line); line = [{ t:'   ', c:sg.c }]; w = ctx.measureText('   ').width; if (ch === ' ') continue; }
            const last = line[line.length - 1];
            if (last && last.c === sg.c) last.t += ch; else line.push({ t:ch, c:sg.c });
            w += cw;
        }
        lines.push(line);
    };
    addWrapped([{ t:`통신망 ${R.title} 대화 기록`, c:col('c2') }]);
    addWrapped([{ t:`저장한 사람 ${S.nick} · ${fmtFull(Date.now())}`, c:col('dim') }]);
    lines.push('rule');
    if (!items.length) addWrapped([{ t:'(아직 대화가 없습니다)', c:col('dim') }]);
    items.forEach(m => {
        if (m.type === 'system') addWrapped([{ t:m.text, c:col('c3') }]);
        else addWrapped([
            { t:(m.timestamp ? fmtHM(m.timestamp) : '') + ' ', c:col('dim') },
            { t:`[${m.nickname}] `, c:m.nickname === S.nick ? col('c2') : col('c1') },
            { t:m.text || '', c:col('fg') }
        ]);
    });
    lines.push('rule');
    addWrapped([{ t:'My Way PC통신 · hosain1291.github.io/pcchat', c:col('dim') }]);
    const H = BAR + 18 + lines.length * LH + 20;
    const SC = 2;
    cv.width = W * SC; cv.height = H * SC;
    ctx.scale(SC, SC);
    ctx.fillStyle = col('bg'); ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = col('bar-bg'); ctx.fillRect(0, 0, W, BAR);
    ctx.font = font; ctx.textBaseline = 'middle';
    ctx.fillStyle = col('bar-fg');
    ctx.fillText(['My Way', ...R.crumb].join(' ▸ '), 14, BAR / 2 + 1);
    const tw = ctx.measureText(fmtFull(Date.now())).width;
    ctx.fillText(fmtFull(Date.now()), W - 14 - tw, BAR / 2 + 1);
    let y = BAR + 18 + LH / 2;
    for (const ln of lines) {
        if (ln === 'rule') { ctx.fillStyle = col('dim'); ctx.fillRect(PX, y - 1, maxW, 2); y += LH; continue; }
        let x = PX;
        for (const sg of ln) { ctx.fillStyle = sg.c; ctx.fillText(sg.t, x, y); x += ctx.measureText(sg.t).width; }
        y += LH;
    }
    if (S.crt) { ctx.fillStyle = 'rgba(0,0,0,.12)'; for (let yy = 0; yy < H; yy += 3) ctx.fillRect(0, yy, W, 1); }
    const name = `MyWay_대화_${R.title.replace(/[\\/:*?"<>|\[\]\s]+/g, '_')}_${new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '')}.png`;
    cv.toBlob(blob => {
        if (!blob) return flash('사진을 만들지 못했습니다.');
        const url = URL.createObjectURL(blob);
        const a = Object.assign(document.createElement('a'), { href:url, download:name });
        document.body.appendChild(a); a.click(); a.remove();
        openPopup(`<div class="viewer"><div class="vt">대화 사진 저장 · ${esc(name)}</div><img src="${url}" alt="대화 사진"><div class="vf">파일로 내려받았습니다. 휴대폰은 사진을 길게 눌러 저장할 수도 있습니다. [아무 키나 누르면 닫힘]</div></div>`);
    }, 'image/png');
}

};
const DISK = 1457664;            // 1.44MB 디스켓 한 장
const MAXFILE = 60 * 1024 * 1024; // 한 번에 올릴 수 있는 최대 크기 (60MB)
const disks = n => Math.max(1, Math.ceil(n / DISK));
const CHUNK = 700000;
const PROTOS = ['Z-modem', 'Y-modem', 'X-modem', 'Kermit'];
const fmtSize = n => n >= 1024 * 1024 ? (n / 1048576).toFixed(2) + 'MB' : n >= 1024 ? Math.ceil(n / 1024) + 'KB' : n + 'B';
const commas = n => Number(n).toLocaleString('ko-KR');
const pickProto = v => { const i = +(v || '1') - 1; return PROTOS[i] || (v === '' ? PROTOS[0] : null); };
const protoMenu = () => `<div class="c1">전송 프로토콜을 고르세요. (그냥 Enter = Z-modem)</div><div class="menu one" style="margin:.3em 0">${PROTOS.map((p, i) => mi(String(i+1), p, '', i === 0 ? '추천 · 이어받기 지원' : i === 3 ? '느리지만 튼튼함' : '')).join('')}</div>`;

function transferBox(el, { dir, proto, name, size }) {
    const blk = proto === 'X-modem' ? 128 : 1024;
    const blocks = Math.max(1, Math.ceil(size / blk));
    let target = 0, shown = 0, last = performance.now(), finished = false, dead = false, resolveDone;
    const t0 = last;
    const done = new Promise(r => resolveDone = r);
    const draw = (errText = '') => {
        const pct = Math.floor(shown * 100);
        const cells = 28, on = Math.round(shown * cells);
        const sec = Math.max(.001, (performance.now() - t0) / 1000);
        el.innerHTML = `<div class="xfer"><span class="cap">[ ${esc(proto)} ${dir === 'up' ? '올리기 (Upload)' : '받기 (Download)'} ]</span>
<div><span class="c2">파일 이름</span> : ${esc(name)}</div>
<div><span class="c2">파일 크기</span> : ${commas(size)} 바이트 <span class="dim">(디스켓 ${disks(size)}장 분량)</span></div>
<div><span class="c2">전송 블록</span> : ${commas(Math.floor(shown * blocks))} / ${commas(blocks)} &nbsp;<span class="dim">(${blk} 바이트)</span></div>
<div class="bar">${'█'.repeat(on)}<span class="dim">${'░'.repeat(cells - on)}</span> ${pct}%</div>
<div><span class="c2">전송 속도</span> : ${commas(Math.round(shown * size / sec))} cps &nbsp; <span class="c2">경과</span> : ${fmtDur(sec * 1000)}</div>
${errText ? `<div class="err">${errText}</div>` : shown >= 1 && finished ? `<div class="c3">전송 완료! ${dir === 'up' ? '자료가 올라갔습니다.' : '자료를 받았습니다.'}</div>` : '<div class="dim">전송 중 ... 끊지 마세요</div>'}</div>`;
        ui.screen.scrollTop = ui.screen.scrollHeight;
    };
    const tick = now => {
        if (dead) return;
        shown = Math.min(target, shown + (now - last) / 1500); last = now;
        draw();
        if (finished && shown >= 1) { resolveDone(); return; }
        requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    return {
        set(f) { target = Math.max(target, Math.min(.98, f)); },
        complete() { target = 1; finished = true; return done; },
        fail(msg) { dead = true; draw(`CAN — 전송이 취소되었습니다. ${msg}`); }
    };
}

function readAsB64(blob) {
    return new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(String(fr.result).split(',')[1] || '');
        fr.onerror = () => rej(fr.error);
        fr.readAsDataURL(blob);
    });
}
function b64ToBlob(b64, type) {
    const parts = [];
    const STEP = 4 * 262144; // base64 4글자 단위로 끊어서 디코딩
    for (let p = 0; p < b64.length; p += STEP) {
        const bin = atob(b64.slice(p, p + STEP)); const u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        parts.push(u8);
    }
    return new Blob(parts, { type:type || 'application/octet-stream' });
}
function loadImg(src) {
    return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
}
async function shrinkImage(file) {
    const url = URL.createObjectURL(file);
    try {
        const im = await loadImg(url);
        const w = im.naturalWidth, h = im.naturalHeight;
        if (file.size <= MAXFILE && /^image\/(jpeg|png|gif|webp|bmp)$/.test(file.type)) return { blob:file, w, h, type:file.type };
        let scale = Math.min(1, 2560 / Math.max(w, h)), q = .9, blob;
        for (let k = 0; k < 6; k++) {
            const cv = document.createElement('canvas');
            cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
            const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
            cx.drawImage(im, 0, 0, cv.width, cv.height);
            blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
            if (blob && blob.size <= MAXFILE) return { blob, w:cv.width, h:cv.height, type:'image/jpeg' };
            scale *= .75; q -= .08;
        }
        return { blob, w, h, type:'image/jpeg' };
    } finally { URL.revokeObjectURL(url); }
}

/* 그림을 16색 ANSI 화면처럼 바꿔 그리기 (플로이드-스타인버그 디더링) */
const CGA = [[0,0,0],[0,0,170],[0,170,0],[0,170,170],[170,0,0],[170,0,170],[170,85,0],[170,170,170],[85,85,85],[85,85,255],[85,255,85],[85,255,255],[255,85,85],[255,85,255],[255,255,85],[255,255,255]];
function ansiCanvas(im, cols) {
    const rows = Math.max(8, Math.min(300, Math.round(cols * im.naturalHeight / im.naturalWidth)));
    const cv = document.createElement('canvas'); cv.width = cols; cv.height = rows; cv.className = 'ansi';
    const cx = cv.getContext('2d');
    cx.drawImage(im, 0, 0, cols, rows);
    const img = cx.getImageData(0, 0, cols, rows), d = img.data;
    const buf = new Float32Array(cols * rows * 3);
    for (let i = 0, j = 0; i < d.length; i += 4, j += 3) { buf[j] = d[i]; buf[j+1] = d[i+1]; buf[j+2] = d[i+2]; }
    const spread = (x, y, e, f) => { if (x < 0 || x >= cols || y >= rows) return; const j = (y * cols + x) * 3; buf[j] += e[0]*f; buf[j+1] += e[1]*f; buf[j+2] += e[2]*f; };
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const j = (y * cols + x) * 3, r = buf[j], g = buf[j+1], b = buf[j+2];
        let best = 0, bd = Infinity;
        for (let k = 0; k < 16; k++) { const c = CGA[k]; const dd = (r-c[0])**2*.3 + (g-c[1])**2*.59 + (b-c[2])**2*.11; if (dd < bd) { bd = dd; best = k; } }
        const c = CGA[best], e = [r - c[0], g - c[1], b - c[2]];
        const i = (y * cols + x) * 4; d[i] = c[0]; d[i+1] = c[1]; d[i+2] = c[2]; d[i+3] = 255;
        spread(x+1, y, e, 7/16); spread(x-1, y+1, e, 3/16); spread(x, y+1, e, 5/16); spread(x+1, y+1, e, 1/16);
    }
    cx.putImageData(img, 0, 0);
    return cv;
}

screens.upload = ({ area }) => {
    const A = PDS[area];
    const crumb = ['자료실', A.name, '올리기'];
    if (!S.me || S.me.guest) {
        show({ crumb, code:A.code, where:A.name, prompt:'명령 >>',

            onInput(v) { if (v === '') back(); } });
        return;
    }
    const st = { step:'desc', desc:'', proto:'Z-modem' };
    const picker = $('#fpick');
    const base = () => header(`${A.name} · 올리기`) +
        `<div class="ph"><div><span class="lab">올린이</span>: <span class="c1">${esc(S.nick)}</span></div>${st.desc ? `<div><span class="lab">설명</span>: <span class="hi">${esc(st.desc)}</span></div>` : ''}${st.step !== 'desc' && st.step !== 'proto' ? `<div><span class="lab">방식</span>: ${esc(st.proto)}</div>` : ''}</div>${rule()}`;
    const openPicker = () => {
        picker.value = '';
        picker.accept = area === 'pic' ? 'image/*' : '';
        picker.click();
    };
    const render = () => {
        if (st.step === 'desc') show({ crumb, code:A.code, where:`${A.name} (올리는 중)`, raw:true, prompt:'설명 >>',
            html: base() + `<div class="c1">올릴 자료의 설명(제목)을 한 줄로 쓰세요. (빈 줄 Enter 는 취소)</div>` });
        else if (st.step === 'proto') show({ prompt:'프로토콜 >>', html: base() + protoMenu() });
        else if (st.step === 'pick') show({ prompt:'명령 >>',
            html: base() + `<div class="c2">${esc(st.proto)} 수신 대기 중 ...</div><div class="c1">보낼 ${area === 'pic' ? '그림' : '파일'}을 고르세요. (최대 60MB${area === 'pic' ? ', 60MB 넘는 사진은 자동으로 줄입니다' : ''})</div>
<button type="button" class="pickbtn" id="pickbtn">[ 파일 고르기 ]</button><div id="xf"></div>${rule()}<div class="hint"><span class="k">Enter</span> 파일 고르기 · <span class="k">/a</span> 취소</div>` });
        const pb = $('#pickbtn'); if (pb) pb.onclick = openPicker;
    };
    render();
    const send = async file => {
        if (!file) return;
        let blob = file, w = 0, h = 0, type = file.type || 'application/octet-stream';
        if (area === 'pic') {
            if (!type.startsWith('image/')) return flash('그림 자료실에는 그림 파일만 올릴 수 있습니다.');
            try { ({ blob, w, h, type } = await shrinkImage(file)); }
            catch (e) { return flash('그림을 읽지 못했습니다. 다른 형식으로 올려 주세요.'); }
        }
        if (blob.size > MAXFILE) return flash(`60MB 보다 큰 자료는 올릴 수 없습니다. (${fmtSize(blob.size)})`);
        let name = file.name.replace(/[\\/:*?"<>|]+/g, '_').slice(0, 60) || 'file';
        if (area === 'pic' && type === 'image/jpeg' && blob !== file) name = name.replace(/\.[^.]+$/, '') + '.jpg';
        st.step = 'send'; S.cur.busy = true; setPrompt('전송 중 ...');
        const pb = $('#pickbtn'); if (pb) pb.remove();
        const box = transferBox($('#xf'), { dir:'up', proto:st.proto, name, size:blob.size });
        try {
            const b64 = await readAsB64(blob);
            const chunks = [];
            for (let i = 0; i < b64.length; i += CHUNK) chunks.push(b64.slice(i, i + CHUNK));
            const fid = DB.newFileId(area);
            await DB.putFile(area, fid, { name, size:blob.size, type, desc:st.desc, author:S.nick, w, h }, chunks, (i, n) => box.set(i / n));
            await box.complete();
            S.cur.busy = false;
            flash('자료가 올라갔습니다. 고맙습니다!', true);
            await sleep(900);
            if (S.cur && S.cur.name === 'upload') back();
        } catch (e) {
            box.fail(errMsg(e));
            S.cur.busy = false; st.step = 'pick'; setPrompt('명령 >>');
        }
    };
    picker.onchange = () => { if (S.cur && S.cur.name === 'upload' && st.step === 'pick') send(picker.files[0]); };
    picker.oncancel = () => { if (st.step === 'pick') flash('파일을 고르지 않았습니다. Enter 로 다시 고르세요.'); };
    S.cur.onLeave = () => { picker.onchange = null; picker.oncancel = null; };
    S.cur.onInput = raw => {
        const v = raw.trim();
        if (S.cur.busy) return flash('전송 중입니다. 잠시 기다리세요.');
        if (v.toLowerCase() === '/a') { flash('올리기를 취소했습니다.'); return back(); }
        if (st.step === 'desc') {
            if (!v) return back();
            st.desc = v.slice(0, 60); st.step = 'proto'; return render();
        }
        if (st.step === 'proto') {
            const p = pickProto(v);
            if (!p) return flash('1~4 중에서 고르세요.');
            st.proto = p; st.step = 'pick'; render();
            openPicker();
            return;
        }
        if (st.step === 'pick') openPicker();
    };
};

    put(rule('═', 'c1'));
    guide();
    setTop(['로그인'], '');
    S.cur = { name:'login', crumb:['로그인'] };
    ask('대화명 :');

    ui.screen.onclick = e => {
        const b = e.target.closest('[data-login]');
        if (!b || S.phase !== 'login' || step !== 'id' || busy) return;
        e.stopPropagation();
        const k = b.dataset.login;
        if (k === 'id') ask('대화명 :'); else S.cur.onInput(k);
    };
    const done = async me => {
        ui.screen.onclick = null;
        S.me = me;
        S.nick = me.nick;
        DB = NET ? makeRemote(NET.F, NET.db, me.uid) : makeLocal(me.uid);
        loadClubs();
        renderStatus();
        if (!me.guest) LS.set('lastId', me.id);
        const last = LS.get('lastLogin.' + me.id, 0);
        put('&nbsp;');
        put(`<span class="c2">${esc(me.nick)}</span>님, 반갑습니다.${me.guest ? ' <span class="dim">(손님 접속)</span>' : ''}`);
        if (last && !me.guest) put(`최근 접속 : ${fmtFull(last)}`, 'dim');
        put(`오늘 날짜 : ${fmtFull(Date.now())}`, 'dim');
        if (!me.guest) LS.set('lastLogin.' + me.id, Date.now());
        S.connectedAt = Date.now();
        ui.cmd.type = 'text';
        await sleep(700);
        ui.cmd.disabled = false;
        noticePopup();
    };
    const fail = msg => { put(msg, 'c4'); };

    S.cur.onInput = async raw => {
        if (busy) return;
        const v = raw.trim();
        switch (step) {
        case 'id': {
            if (!v) { guide(); return; }
            const l = v.toLowerCase();
            if (['new', '가입', '회원가입', '2'].includes(l)) { put(`대화명 : <span class="hi">${esc(v)}</span>`); put('&nbsp;'); put('[ 회 원 가 입 ]', 'c2');
                put('대화명은 2~10자 (영문 · 숫자 · 한글 · _), 대·소문자를 구분합니다. 가입하면 바꿀 수 없습니다.', 'dim');
                step = 'newId'; ask('새 대화명 :'); return; }
            if (l === '1') { ask('대화명 :'); return; }
            if (l === 'guest' || l === '손님' || l === '3') {
                put(`대화명 : <span class="hi">guest</span>`);
                busy = true; ui.cmd.disabled = true;
                try { await done(await AUTH.guest()); }
                catch (e) { busy = false; fail(authMessage(e)); ask('대화명 :'); }
                return;
            }
            put(`대화명 : <span class="hi">${esc(v)}</span>`);
            if (!ID_RE.test(v)) { fail('대화명 또는 비밀번호가 틀립니다.'); return countFail(); }
            form.id = v; step = 'pw'; ask('비밀번호 :', true); return;
        }
        case 'pw': {
            put(`비밀번호 : <span class="hi">${'*'.repeat(Math.min(raw.length, 16))}</span>`);
            busy = true; ui.cmd.disabled = true; setPrompt('확인 중 ...');
            try { const me = await AUTH.login(form.id, raw); await done(me); }
            catch (e) {
                busy = false;
                fail(authMessage(e));
                const c = e && e.code;
                if (['auth/operation-not-allowed', 'auth/network-request-failed', 'auth/too-many-requests', 'auth/admin-restricted-operation'].includes(c) || (e && e.message === 'timeout')) {
                    step = 'id'; ask('대화명 :'); return;
                }
                countFail();
            }
            return;
        }
        case 'newId': {
            if (!v) { put('가입을 취소했습니다.', 'dim'); step = 'id'; guide(); ask('대화명 :'); return; }
            put(`새 대화명 : <span class="hi">${esc(v)}</span>`);
            if (!ID_RE.test(v) || ['new', 'guest', '가입', '회원가입', '손님'].includes(v.toLowerCase())) { fail('쓸 수 없는 대화명입니다. 2~10자 영문 · 숫자 · 한글 · _ 만 됩니다.'); ask('새 대화명 :'); return; }
            form.id = v; step = 'newPw';
            put('비밀번호는 6자 이상, 대·소문자와 띄어쓰기까지 정확히 구분합니다.', 'dim');
            ask('비밀번호 :', true); return;
        }
        case 'newPw': {
            put(`비밀번호 : <span class="hi">${'*'.repeat(Math.min(raw.length, 16))}</span>`);
            if (raw.length < 6) { fail('비밀번호는 6자 이상이어야 합니다.'); ask('비밀번호 :', true); return; }
            form.pw = raw; step = 'newPw2'; ask('비밀번호 확인 :', true); return;
        }
        case 'newPw2': {
            put(`비밀번호 확인 : <span class="hi">${'*'.repeat(Math.min(raw.length, 16))}</span>`);
            if (raw !== form.pw) { fail('비밀번호가 서로 다릅니다. 다시 입력하세요.'); step = 'newPw'; ask('비밀번호 :', true); return; }
            busy = true; ui.cmd.disabled = true; setPrompt('가입 중 ...');
            try {
                const me = await AUTH.signup(form.id, form.pw);
                put(`가입을 축하합니다! 다음부터 대화명 <span class="c2">${esc(form.id)}</span> 과 비밀번호로 접속하세요.`, 'c3');
                form.pw = '';
                await done(me);
            } catch (e) {
                busy = false; form.pw = '';
                fail(authMessage(e));
                if (e && e.code === 'auth/email-already-in-use') { step = 'newId'; ask('새 대화명 :'); }
                else { step = 'id'; guide(); ask('대화명 :'); }
            }
            return;
        }
        }
    };
    function countFail() {
        tries++;
        if (tries >= MAX_TRIES) {
            put('&nbsp;');
            put(`${MAX_TRIES}번 틀려서 접속을 끊습니다.`, 'c4');
            put('NO CARRIER', 'c4');
            put('다시 접속하려면 [Enter] 를 누르세요.', 'dim');
            S.phase = 'dead'; ui.cmd.type = 'text'; setPrompt('>>'); ui.cmd.disabled = false; renderStatus();
            return;
        }
        put(`(${tries}/${MAX_TRIES}번 틀림)`, 'dim');
        step = 'id'; ask('대화명 :');
    }
}

window.addEventListener('pagehide', () => { if (S.phase === 'run') { leaveCurrent(); DB.delPresence(); } });
renderStatus();
boot();
</script>
</body>
</html>
